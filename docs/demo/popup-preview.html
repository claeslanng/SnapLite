<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SnapLite popup preview</title>
<!-- Static copy of extension/popup.html with sample state, for the README screenshot
     (the real popup only runs inside the browser). -->
<style>
  :root {
    --bg: #f9f9f9; --fg: #1b1b1b; --sub: #5f5f5f; --line: #dcdcdc;
    --btn: #ffffff; --btn-hover: #f0f0f0; --accent: #005fb8; --ok: #107c10;
  }
  * { box-sizing: border-box; }
  html, body { background: #e9ebef; }
  body { margin: 0; padding: 12px; font: 13px/1.4 "Segoe UI", system-ui, sans-serif; color: var(--fg); }
  .popup { width: 300px; padding: 12px; background: var(--bg); border: 1px solid #cfd3da; border-radius: 8px; box-shadow: 0 8px 24px rgba(0,0,0,.18); }
  header { display: flex; align-items: center; gap: 8px; font-weight: 600; font-size: 14px; margin-bottom: 10px; }
  header i { width: 20px; height: 20px; border-radius: 5px; background: #0078d4; display: inline-block; position: relative; }
  header i::after { content: ""; position: absolute; inset: 5px; border: 2px solid #fff; border-radius: 2px; }
  .actions { display: grid; gap: 6px; }
  .btn { display: flex; justify-content: space-between; align-items: center; padding: 9px 12px;
         border: 1px solid var(--line); border-radius: 6px; background: var(--btn); }
  .btn.primary { border-color: var(--accent); }
  .btn small { display: block; color: var(--sub); font-size: 11.5px; }
  kbd { font: 11px "Segoe UI", system-ui, sans-serif; color: var(--sub); white-space: nowrap; }
  .options { margin: 12px 0 0; display: grid; gap: 6px; }
  label { display: flex; gap: 8px; align-items: flex-start; }
  label input { margin: 2px 0 0; }
  .status { margin-top: 12px; padding-top: 10px; border-top: 1px solid var(--line); color: var(--sub); font-size: 12px; }
  .ok { color: var(--ok); font-weight: 600; }
</style>
</head>
<body>
<div class="popup">
  <header><i></i>SnapLite</header>
  <div class="actions">
    <div class="btn primary"><span>Full page<small>The whole page, top to bottom</small></span><kbd>Alt+Shift+F</kbd></div>
    <div class="btn"><span>Page in steps<small>Numbered images, one per section</small></span><kbd>Alt+Shift+S</kbd></div>
    <div class="btn"><span>Visible part<small>Just what's on screen</small></span><kbd>Alt+Shift+V</kbd></div>
  </div>
  <div class="options">
    <label><input type="checkbox" checked><span>Hide cookie banners, pop-ups and floating buttons</span></label>
    <label><input type="checkbox" checked><span>Steps: split at sections (otherwise one per screen)</span></label>
    <label><input type="checkbox" checked><span>Save with the SnapLite app (folder, clipboard, notification)</span></label>
  </div>
  <div class="status">
    <div><span class="ok">● Connected to SnapLite 1.0.0</span><br>Captures are saved to your SnapLite folder.</div>
    <div style="margin-top:6px">Saved 6 steps with SnapLite.</div>
  </div>
</div>
</body>
</html>
